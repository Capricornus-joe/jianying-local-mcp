[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jianying-local-mcp"
version = "0.3.0"
description = "Local-first editable Jianying drafts for macOS AI workflows."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["mcp", "jianying", "video-editing", "macos", "subtitles"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2", "imageio-ffmpeg>=0.6,<0.7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
jianying-local-mcp = "jianying_local_mcp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/mjz925804554-jpg/jianying-local-mcp"
Repository = "https://github.com/mjz925804554-jpg/jianying-local-mcp"
Issues = "https://github.com/mjz925804554-jpg/jianying-local-mcp/issues"
Documentation = "https://github.com/mjz925804554-jpg/jianying-local-mcp/blob/main/docs/tools.md"
